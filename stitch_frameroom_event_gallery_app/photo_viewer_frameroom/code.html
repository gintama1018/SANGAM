<script>
  (function() {
    const likeBtn = document.getElementById('likeButton');
    const likeIcon = document.getElementById('likeIcon');
    const likeCount = document.getElementById('likeCount');
    const heartBurst = document.getElementById('heartBurst');
    const photoTapArea = document.getElementById('photoTapArea');
    const downloadBtn = document.getElementById('downloadBtn');
    const telemetryToggle = document.getElementById('telemetryToggle');
    const metadataPanel = document.getElementById('metadataPanel');

    let liked = false;
    let count = 148;

    function triggerLikeAnimation() {
      if (!liked) {
        liked = true;
        count += 1;
        likeCount.textContent = count;
        likeIcon.style.fontVariationSettings = "'FILL' 1";
        likeIcon.classList.add('text-error');
        likeBtn.classList.add('text-error');
      }

      // Show floating center heart
      heartBurst.classList.remove('opacity-0', 'scale-50');
      heartBurst.classList.add('opacity-100', 'scale-110');
      setTimeout(() => {
        heartBurst.classList.remove('opacity-100', 'scale-110');
        heartBurst.classList.add('opacity-0', 'scale-50');
      }, 550);
    }

    likeBtn.addEventListener('click', () => {
      if (!liked) {
        triggerLikeAnimation();
      } else {
        liked = false;
        count -= 1;
        likeCount.textContent = count;
        likeIcon.style.fontVariationSettings = "'FILL' 0";
        likeIcon.classList.remove('text-error');
        likeBtn.classList.remove('text-error');
      }
    });

    let lastTap = 0;
    photoTapArea.addEventListener('click', (e) => {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        triggerLikeAnimation();
      }
      lastTap = currentTime;
    });

    telemetryToggle.addEventListener('click', () => {
      metadataPanel.classList.toggle('opacity-0');
      metadataPanel.classList.toggle('pointer-events-none');
    });

    downloadBtn.addEventListener('click', () => {
      const originalText = downloadBtn.innerHTML;
      downloadBtn.innerHTML = `
        <span class="material-symbols-outlined text-[20px] animate-spin">sync</span>
        <span class="font-label-md text-label-md font-bold">Saving 4K...</span>
      `;
      setTimeout(() => {
        downloadBtn.innerHTML = `
          <span class="material-symbols-outlined text-[20px]">check_circle</span>
          <span class="font-label-md text-label-md font-bold">Saved!</span>
        `;
        setTimeout(() => {
          downloadBtn.innerHTML = originalText;
        }, 2000);
      }, 900);
    });
  })();
